name: HG-PIPE CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Algorithmic Verification & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run HG-PIPE Parametric Case Generation (Step 0)
        run: |
          python scripts/step0_case_generation.py --config statistics/vit_base_config.json
          python scripts/step0_case_generation.py --config statistics/nanogpt_config.json

      - name: Execute Automated Unit & Math Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Synthesizable C++ Kernel Headers
        run: |
          test -f src/hls/layernorm/layernorm_kernel.h
          test -f src/hls/softmax/softmax_kernel.h
          test -f src/hls/gelu/gelu_kernel.h
          test -f src/hls/common/types.h
