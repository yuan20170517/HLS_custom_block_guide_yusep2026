# ==============================================================================
# AMD Vitis Unified IDE / Vitis HLS Component Configuration
# Target Platform: AMD Versal AI Edge Gen 2 VEK385
# Device Part: xc2ve3858-ssva2112-2MP-e-S
# Component: Quantized Multi-Head Attention (MHA) Kernel
# ==============================================================================

part=xc2ve3858-ssva2112-2MP-e-S

[hls]
# Clock constraints matching Versal Gen 2 PL clock target (313 MHz)
clock=3.194ns
clock_uncertainty=12%

# Top-level synthesis function
syn.top=mha_top

# Source & Testbench Files
syn.file=src/mha_kernel/mha_top.cpp
syn.file=src/mha_kernel/mha_kernel.cpp
syn.file=src/mha_kernel/mha_kernel.hpp
syn.file=src/common/hls_common.hpp
tb.file=src/mha_kernel/tb_mha_kernel.cpp

# Synthesis directives
syn.compile.pipeline_loops=5

# Verification & Packaging
csim.clean=1
cosim.rtl=verilog
package.output.format=xo
package.output.file=xo/mha_kernel.xo
package.output.syn=false
