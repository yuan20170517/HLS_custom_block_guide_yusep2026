# ==============================================================================
# AMD Vitis Unified IDE / Vitis HLS Component Configuration
# Target Platform: AMD Versal AI Edge Gen 2 VEK385
# Device Part: xc2ve3858-ssva2112-2MP-e-S
# Component: Row-Wise Softmax Activation Kernel
# ==============================================================================

part=xc2ve3858-ssva2112-2MP-e-S

[hls]
# Clock constraints matching Versal Gen 2 PL clock target (312.5 MHz)
clock=3.20ns
clock_uncertainty=12%

# Top-level synthesis function
syn.top=softmax_kernel

# Source & Testbench Files
syn.file=src/softmax/softmax_kernel.cpp
syn.file=src/softmax/softmax_kernel.h
syn.file=src/common/types.h
tb.file=src/softmax/tb_softmax_kernel.cpp

# Synthesis directives
syn.compile.pipeline_loops=5

# Verification & Packaging
csim.clean=1
cosim.rtl=verilog
package.output.format=xo
package.output.file=xo/softmax_kernel.xo
package.output.syn=false
