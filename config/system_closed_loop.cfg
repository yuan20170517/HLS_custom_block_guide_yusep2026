# ==============================================================================
# AMD Vitis System Linker Configuration (v++ --link)
# Architecture: 100% On-Chip Closed-Loop Autoregressive Generation
# Target Platform: AMD Versal AI Edge Gen 2 VEK385 (xc2ve3858)
# ==============================================================================

[connectivity]
# ------------------------------------------------------------------------------
# 1. Kernel Instances
# ------------------------------------------------------------------------------
# Pre-Processing: Token & Position Embedding Streamer
nk=embedding_kernel:1:embed_0

# Core Processing: Quantized Multi-Head Attention (or AIE-ML NPU Graph)
nk=mha_top:1:mha_0

# Post-Processing: Output Token Retrieval (ArgMax / Top-K Logit Sampler)
nk=sampler_kernel:1:sampler_0

# ------------------------------------------------------------------------------
# 2. Memory Bank Mappings (LPDDR4 / LPDDR5X Channels)
# ------------------------------------------------------------------------------
# Embedding Tables in off-chip memory
sp=embed_0.m_axi_gmem0:LPDDR4_0   # Word Token Embedding (WTE: 50,257 x 768)
sp=embed_0.m_axi_gmem1:LPDDR4_0   # Word Position Embedding (WPE: 1,024 x 768)
sp=embed_0.m_axi_gmem2:LPDDR4_0   # Optional Memory Writeback Buffer

# MHA Weights & Token Buffers
sp=mha_0.m_axi_gmem0:LPDDR4_1     # Input Tokens
sp=mha_0.m_axi_gmem1:LPDDR4_1     # Q, K, V Projection Weights
sp=mha_0.m_axi_gmem2:LPDDR4_1     # Output Attended Tokens

# Sampler Logit Tensor Buffer
sp=sampler_0.m_axi_gmem0:LPDDR4_0 # Logits Buffer (50,257 floats from LM Head)
sp=sampler_0.m_axi_gmem1:LPDDR4_0 # Top-K Output Candidate Array

# ------------------------------------------------------------------------------
# 3. Direct High-Speed AXI4-Stream Channels (PLIO / Wire-Speed Bypassing CPU)
# ------------------------------------------------------------------------------
# Stream Embedding Vector directly to AIE-ML NPU or PL Core
# stream_connect=embed_0.stream_to_aie:ai_engine_0.in_tokens

[advanced]
# Clock assignment matching 312.5 MHz PL fabric clock
param=compiler.addOutputStopBits=1
